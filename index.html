<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- 0.30 · Politique de sécurité : scripts du site seulement (+ compteur GoatCounter et livre d'or giscus),
       données lues seulement sur GitHub (status.json), Lanyard (Discord) et GoatCounter ; rien d'autre ne peut
       s'exécuter même si un texte malveillant passait dans la page. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://gc.zgo.at https://giscus.app; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; media-src 'self' https:; font-src 'self' data:; connect-src 'self' https://raw.githubusercontent.com https://api.lanyard.rest https://*.goatcounter.com https://giscus.app; frame-src https://giscus.app; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Profil</title>
  <meta name="description" content="Mon profil, mis à jour par KuroPurr." />
  <link rel="icon" href="logo.png" />
  <link rel="stylesheet" href="style.css?v=0.30.1" />
</head>
<body>
  <div class="bg" id="bg" aria-hidden="true"></div>
  <div class="bg-dim" aria-hidden="true"></div>

  <div class="page">
    <!-- Haut de page -->
    <header class="top">
      <div class="box status"><span class="dot" id="dot"></span><span id="statusText">Chargement…</span></div>
      <nav class="box nav" id="nav" aria-label="Pages">
        <button class="on" data-page="profil" type="button">Profil</button>
        <button data-page="projets" type="button">Posts &amp; Projets</button>
        <button data-page="jeux" type="button">Jeux</button>
        <button data-page="mediatheque" type="button">Médiathèque</button>
        <button data-page="musique" type="button">Musique</button>
        <button data-page="divers" type="button">Divers</button>
      </nav>
      <div class="top-right">
        <button class="box ver" id="verClientBtn" type="button" title="Journal des mises à jour de KuroPurr">KuroPurr <b id="verClient">—</b></button>
        <button class="box ver" id="verSiteBtn" type="button" title="Journal des versions du site">Site <b id="verSite">—</b></button>
      </div>
    </header>

    <main class="grid" data-page="profil">
      <!-- Gros carré : moi -->
      <section class="box card me">
        <div class="avatar"><img src="logo.png" alt="" id="avatar" /></div>
        <h1 class="pseudo"><span id="pseudo"></span><span class="caret" aria-hidden="true"></span></h1>
        <div class="tags" id="tags"></div>
        <hr />
        <div class="md" id="description"></div>
      </section>

      <div class="col">
        <!-- Discord -->
        <section class="box card discord" id="discord" hidden>
          <span class="dc-logo">Discord</span>
          <div class="dc-head">
            <div class="dc-avatar"><img src="logo.png" alt="" id="dcAvatar" /><img class="dc-deco" alt="" id="dcDeco" hidden /><span class="ring" id="dcRing"></span></div>
            <div class="dc-names">
              <strong id="dcName"></strong>
              <span class="muted" id="dcTag"></span>
              <div class="dc-badges" id="dcBadges"></div>
            </div>
          </div>
          <hr />
          <div id="dcPresence"><p class="muted small">Aucune activité Discord.</p></div>
        </section>

        <!-- Activité -->
        <section class="box card">
          <div class="now-head"><h2 id="nowTitle">Activité en cours</h2><span class="live-tag" id="liveTag" title="Activité en cours : la page se met à jour plus souvent" hidden>en direct</span></div>
          <div id="now"></div>
          <button class="link-btn" id="nowMore" type="button" hidden>Voir toutes les activités en cours</button>
          <div id="nowAll" hidden></div>
          <h2>Dernières activités</h2>
          <ul class="list" id="history"></ul>
          <button class="more" id="historyMore" type="button" hidden>Afficher plus</button>
        </section>

        <!-- Liens -->
        <section class="box card">
          <h2>Liens</h2>
          <div class="links" id="links"></div>
          <button class="more" id="linksMore" type="button" hidden>Afficher plus</button>
        </section>
      </div>
    </main>

    <!-- Projets & Portfolio -->
    <main class="grid grid-projects" data-page="projets" hidden>
      <section class="box card">
        <h1 class="big-title">Posts</h1>
        <div class="ptags" id="ptags"></div>
        <hr />
        <div class="posts" id="posts"></div>
        <button class="more" id="postsMore" type="button" hidden>Voir plus</button>
      </section>
      <section class="box card">
        <h1 class="big-title">Mes projets</h1>
        <div class="pstats" id="pstats"></div>
        <hr />
        <div class="projects" id="projects"></div>
        <button class="more" id="projectsMore" type="button" hidden>Voir plus</button>
      </section>
    </main>

    <!-- Jeux -->
    <main class="stage" data-page="jeux" hidden>
      <section class="box card">
        <div class="switch" id="libSwitch">
          <button class="on" data-lib="steam" type="button">Steam</button>
          <button data-lib="roblox" type="button">Roblox</button>
          <button data-lib="minecraft" type="button">Minecraft</button>
        </div>
        <div id="libBody"></div>
      </section>
    </main>

    <main class="stage" data-page="mediatheque" hidden>
      <section class="box card">
        <div class="switch" id="aniSwitch">
          <button class="on" data-kind="anime" type="button">Anime</button>
          <button data-kind="manga" type="button">Manga</button>
          <button data-kind="series" type="button">Séries</button>
          <button data-kind="films" type="button">Films</button>
        </div>
        <div id="aniBody"></div>
      </section>
    </main>

    <!-- Divers : tuiles -->
    <main class="stage" data-page="divers" hidden>
      <section class="box card">
        <h1 class="big-title">Divers</h1>
        <p class="muted small center">Tout ce qui ne rentrait nulle part ailleurs. Clique sur une tuile.</p>
        <div class="tiles" id="tiles"></div>
      </section>
    </main>

    <!-- Musique -->
    <main class="stage" data-page="musique" hidden>
      <section class="box card">
        <div class="switch" id="musSwitch">
          <button class="on" data-mus="spotify" type="button">Spotify</button>
          <button data-mus="kuropurr" type="button">KuroPurr Musique</button>
        </div>
        <div id="musBody"></div>
      </section>
    </main>

    <footer class="foot">
      <span class="box small" id="updated">—</span>
      <button class="box small" id="views" type="button" title="Visiteurs par pays">—</button>
      <span class="box small made">Powered by KuroPurr <span class="sep">•</span> <img src="logo.png" alt="" id="footLogo" /></span>
    </footer>
  </div>

  <!-- Fiches (modales), hors de .page : son animation en ferait le repère du « fixed » -->
  <div class="modal" id="modal" hidden>
    <div class="box modal-box">
      <button class="close" id="modalClose" type="button" aria-label="Fermer">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="extras.js?v=0.30.1"></script>
  <script src="app.js?v=0.30.1"></script>
</body>
</html>

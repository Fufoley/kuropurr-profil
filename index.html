<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profil</title>
  <meta name="description" content="Mon profil, mis à jour par KuroPurr." />
  <link rel="icon" href="logo.png" />
  <link rel="stylesheet" href="style.css?v=0.16.0" />
</head>
<body>
  <div class="bg" id="bg" aria-hidden="true"></div>
  <div class="bg-dim" aria-hidden="true"></div>

  <div class="page">
    <!-- Haut de page -->
    <header class="top">
      <div class="box status"><span class="dot" id="dot"></span><span id="statusText">Chargement…</span></div>
      <nav class="box nav" id="nav" aria-label="Pages">
        <button class="on" data-page="profil" type="button">Profil</button>
        <button data-page="projets" type="button">Posts &amp; Projets</button>
        <button data-page="jeux" type="button">Jeux</button>
        <button data-page="anime" type="button">Anime</button>
      </nav>
      <div class="top-right">
        <div class="box ver" title="Version de KuroPurr">KuroPurr <b id="verClient">—</b></div>
        <div class="box ver" title="Version du site">Site <b id="verSite">—</b></div>
      </div>
    </header>

    <main class="grid" data-page="profil">
      <!-- Gros carré : moi -->
      <section class="box card me">
        <div class="avatar"><img src="logo.png" alt="" id="avatar" /></div>
        <h1 class="pseudo"><span id="pseudo"></span><span class="caret" aria-hidden="true"></span></h1>
        <div class="tags" id="tags"></div>
        <hr />
        <div class="md" id="description"></div>
      </section>

      <div class="col">
        <!-- Discord -->
        <section class="box card discord" id="discord" hidden>
          <span class="dc-logo">Discord</span>
          <div class="dc-head">
            <div class="dc-avatar"><img src="logo.png" alt="" id="dcAvatar" /><img class="dc-deco" alt="" id="dcDeco" hidden /><span class="ring" id="dcRing"></span></div>
            <div class="dc-names">
              <strong id="dcName"></strong>
              <span class="muted" id="dcTag"></span>
              <div class="dc-badges" id="dcBadges"></div>
            </div>
          </div>
          <hr />
          <div id="dcPresence"><p class="muted small">Aucune activité Discord.</p></div>
        </section>

        <!-- Activité -->
        <section class="box card">
          <h2 id="nowTitle">Activité en cours</h2>
          <div id="now"></div>
          <button class="link-btn" id="nowMore" type="button" hidden>Voir toutes les activités en cours</button>
          <div id="nowAll" hidden></div>
          <h2>Dernières activités</h2>
          <ul class="list" id="history"></ul>
          <button class="more" id="historyMore" type="button" hidden>Afficher plus</button>
        </section>

        <!-- Liens -->
        <section class="box card">
          <h2>Liens</h2>
          <div class="links" id="links"></div>
          <button class="more" id="linksMore" type="button" hidden>Afficher plus</button>
        </section>
      </div>
    </main>

    <!-- Projets & Portfolio -->
    <main class="grid grid-projects" data-page="projets" hidden>
      <section class="box card">
        <h1 class="big-title">Posts</h1>
        <div class="ptags" id="ptags"></div>
        <hr />
        <div class="posts" id="posts"></div>
        <button class="more" id="postsMore" type="button" hidden>Voir plus</button>
      </section>
      <section class="box card">
        <h1 class="big-title">Mes projets</h1>
        <div class="pstats" id="pstats"></div>
        <hr />
        <div class="projects" id="projects"></div>
        <button class="more" id="projectsMore" type="button" hidden>Voir plus</button>
      </section>
    </main>

    <!-- Jeux -->
    <main class="stage" data-page="jeux" hidden>
      <section class="box card">
        <div class="switch" id="libSwitch">
          <button class="on" data-lib="steam" type="button">Steam</button>
          <button data-lib="roblox" type="button">Roblox</button>
          <button data-lib="minecraft" type="button">Minecraft</button>
        </div>
        <div id="libBody"></div>
      </section>
    </main>

    <main class="stage" data-page="anime" hidden>
      <section class="box card">
        <div class="switch" id="aniSwitch">
          <button class="on" data-kind="anime" type="button">Anime</button>
          <button data-kind="manga" type="button">Manga</button>
        </div>
        <div id="aniBody"></div>
      </section>
    </main>

    <!-- Fiche d'un projet -->
    <div class="modal" id="modal" hidden>
      <div class="box modal-box">
        <button class="close" id="modalClose" type="button" aria-label="Fermer">✕</button>
        <div id="modalBody"></div>
      </div>
    </div>

    <footer class="foot">
      <span class="box small" id="updated">—</span>
      <span class="box small" id="views">—</span>
      <span class="box small made">Powered by KuroPurr <span class="sep">•</span> <img src="logo.png" alt="" /></span>
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="app.js?v=0.16.0"></script>
</body>
</html>

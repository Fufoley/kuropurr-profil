<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profil</title>
  <meta name="description" content="Ce que je fais en ce moment, mis à jour par KuroPurr." />
  <link rel="icon" href="logo.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card" id="card">
    <header class="who">
      <div class="avatar" id="avatar"><img src="logo.png" alt="" id="avatarImg" /></div>
      <div class="who-text">
        <h1 id="pseudo">…</h1>
        <p class="presence" id="presence"><span class="dot" id="dot"></span><span id="presenceText">Chargement…</span></p>
      </div>
    </header>
    <p class="mood" id="mood" hidden></p>
    <p class="bio" id="bio" hidden></p>

    <section class="now" id="now">
      <h2>En ce moment</h2>
      <div class="row" id="gameRow" hidden>
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7.5 8h9a4.5 4.5 0 0 1 4.4 5.5l-.8 3.5a2.2 2.2 0 0 1-3.8 1l-2-2.2h-4.6l-2 2.2a2.2 2.2 0 0 1-3.8-1l-.8-3.5A4.5 4.5 0 0 1 7.5 8z"/><path d="M8 11v3M6.5 12.5h3M15.5 12h.01M17.5 13.5h.01"/></svg></span>
        <div class="row-text">
          <strong id="gameName"></strong>
          <span class="muted"><span id="gamePlatform"></span> · depuis <span id="gameSince"></span></span>
        </div>
      </div>
      <div class="row" id="musicRow" hidden>
        <span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 17.5V5.5l10-2v12"/><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="16.5" cy="15.5" r="2.5"/></svg></span>
        <div class="row-text">
          <strong id="musicTitle"></strong>
          <span class="muted" id="musicArtist"></span>
          <div class="bar"><div class="fill" id="musicFill"></div></div>
          <span class="times"><span id="musicPos">0:00</span><span id="musicLen">0:00</span></span>
        </div>
      </div>
      <p class="muted quiet" id="nothing" hidden>Rien de particulier pour l’instant.</p>
    </section>

    <nav class="links" id="links"></nav>
    <footer class="foot">
      <span id="updated"></span>
      <span class="made"><img src="logo.png" alt="" /> via KuroPurr</span>
    </footer>
  </main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
